# =============================================================================
# 모기지 서류 페이지 분류기의 룰 설정 파일.
#
# 공식 5개 문서 유형 내에서는 시그니처, 가중치, 임계값, 마스킹 규칙과 재조립
# 설정을 Python 분류 로직과 분리해 이 파일만으로 조정할 수 있다. 새로운 문서
# 유형을 추가하려면 `src/schema.py`의 `DocType` Enum 등 Python 변경이 함께
# 필요하다 (`src/rule_classifier.py`가 `DocType(doc_type_name)`으로 이 값을
# 조회한다).
#
# 아래의 모든 시그널은 package_01 기준으로 검증했다. 데이터를 직접 확인한 뒤
# 선정한 개발셋 시그널이므로, 그 자체로 일반화 성능의 근거가 되지는 않는다.
# =============================================================================

version: "1.1.0"

# -----------------------------------------------------------------------------
# 스코어링
#
# rule_score 는 보정된 확률이 아니라 휴리스틱 근거 점수다.
#
#   raw[c]      = 매칭된 클래스 c 시그널들의 가중치 합
#   share[c]    = raw[c] / sum(raw)                     (합이 0이면 0)
#   mass        = min(1.0, raw[top1] / evidence_saturation)
#   rule_score  = share[top1] * mass
#   rule_margin = share[top1] - share[top2]
#
# 아래 기본값에서 strong 시그널 하나는 rule_score 1.0 을 만들고, weak 시그널
# 하나는 0.25 에 그쳐 위임 임계값 아래로 떨어진다. 의도된 설계다.
# weak 키워드 하나만으로 확정해서는 안 된다.
# -----------------------------------------------------------------------------
scoring:
  strong_weight: 1.0
  weak_weight: 0.25
  evidence_saturation: 1.0
  case_sensitive: false

# -----------------------------------------------------------------------------
# LLM 위임
#
# 순서대로 평가한다. strong 시그니처가 걸리면 나머지 조건은 건너뛴다.
# 값은 package_01 에서 조정한 개발용 휴리스틱이다.
# -----------------------------------------------------------------------------
delegation:
  strong_signature_short_circuit: true
  short_text_threshold: 100      # 정규화(공백 축약) 후 문자 길이 기준
  rule_score_threshold: 0.60
  rule_margin_threshold: 0.20
  delegate_on_conflicting_strong_signals: true
  require_multiple_classes_for_margin_check: true

# -----------------------------------------------------------------------------
# 페이지 마커
#
# `priority` 오름차순으로 적용하며, 먼저 매칭된 패턴이 이기고 이후 패턴은
# 시도하지 않는다. 이 순서가 중요하다. "Page 7 of 11" 은 일반 "N of M" 패턴도
# 만족시키므로 PAGE_N_OF_M 을 먼저 시도해야 한다. 결과로 얻은 `marker_style`
# 을 보존하는 이유는, package_01 에서 URLA_1003 과 CREDIT_REPORT 가 둘 다
# total 11 을 보고하고 이 둘을 가르는 것이 style 이기 때문이다.
#
# 마커는 현재 분류 점수에는 사용하지 않고 논리 재조립의 구조 신호로만
# 사용한다(`marker_style`, `marker_page`, `marker_total`). 각 문서 유형 블록의
# `marker_affinity` 필드는 설정에 남아 있는 향후 확장용 값이며, 현재 실행
# 경로(`src/rule_classifier.py`)의 분류 점수 계산에는 사용되지 않는다.
# -----------------------------------------------------------------------------
markers:
  - style: CLTA_PAGE_N
    priority: 10
    regex: 'CLTA\s+Preliminary\s+Report\s+Form.*?Page\s+(?P<page>\d{1,3})'
    flags: [IGNORECASE, DOTALL]
    total_group: null

  - style: PAGE_N_OF_M
    priority: 20
    regex: 'Page\s+(?P<page>\d{1,3})\s+of\s+(?P<total>\d{1,3})'
    flags: [IGNORECASE]

  - style: N_OF_M
    priority: 30
    regex: '(?P<page>\d{1,3})\s+of\s+(?P<total>\d{1,3})'
    flags: [IGNORECASE]

marker_constraints:
  max_total: 500          # 본문에서 잘못 잡힌 비현실적인 값을 거른다
  reject_if_page_gt_total: true

# -----------------------------------------------------------------------------
# 문서 인스턴스 식별자
#
# "CREDIT_REPORT#1" 같은 런타임 한정 대체 ID 를 만드는 데에만 사용한다.
# 원본 값은 저장하지 않는다.
#
# 참고: package_01 에서 loan number 는 CREDIT_REPORT(14페이지)와
# URLA_1003(4페이지) 양쪽에 나타난다. 따라서 식별자만으로는 페이지를 묶을 수
# 없고, 항상 doc_type / marker_style / marker_total 과 함께 사용한다.
# -----------------------------------------------------------------------------
instance_identifiers:
  - name: loan_number
    regex: 'Loan\s*Number[:\s]*(\d{6,12})'
    scope: [URLA_1003, CREDIT_REPORT]
  - name: report_id
    regex: 'Report\s*ID[:\s]*(\d{6,12})'
    scope: [CREDIT_REPORT]
  - name: prelim_number
    regex: 'PRELIM\s*(?:NO\.?|Number)[:\s]*([\d\-]{6,20})'
    scope: [TITLE_REPORT]
  - name: form_family
    regex: '(Freddie\s+Mac\s+Form\s+65)'
    scope: [URLA_1003]

# -----------------------------------------------------------------------------
# 텍스트가 프로세스 밖으로 나가기 전에 적용하는 PII 마스킹.
#
# 정책의 핵심은 식별자와 의미를 분리하는 것이다. 금액, 직업명, 서식 제목,
# 문서 유형 토큰은 분류 신호를 담고 있으므로 보존한다. package_01 의 P&L
# 페이지에는 표준적인 소득 키워드가 없어서, 금액까지 마스킹하면 분류 자체가
# 불가능해진다.
# -----------------------------------------------------------------------------
masking:
  preserve_tokens:
    - "Realtor"
    - "CTEC"
    - "Profit & Loss"
    - "Statement"
    - "Total Expenses"
    - "Net Income"
    - "Sales"

  # 순서가 중요하다. 구체적인 식별자 패턴을 일반 장자리수 규칙보다 먼저
  # 적용해야 형식이 있는 금액이 그 규칙에 도달하지 않는다.
  patterns:
    - name: ssn
      regex: '\b\d{3}-\d{2}-\d{4}\b'
      replacement: "[SSN]"
    - name: email
      regex: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
      replacement: "[EMAIL]"
    - name: phone
      regex: '\b\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b'
      replacement: "[PHONE]"
    - name: zip_state_line
      regex: '\b[A-Z]{2}\s+\d{5}(?:-\d{4})?\b'
      replacement: "[CITY_STATE_ZIP]"
    - name: street_address
      regex: '\b\d{1,6}\s+[A-Z][A-Za-z]*(?:\s+[A-Z][A-Za-z]*){0,3}\s+(?:St|Street|Rd|Road|Ave|Avenue|Blvd|Boulevard|Way|Dr|Drive|Ct|Court|Ln|Lane|Ter|Terrace)\b\.?'
      replacement: "[ADDRESS]"
    - name: ctec_number
      regex: '(CTEC\s*#\s*)[A-Z]?\d{4,10}'
      replacement: '\1[ID]'
    - name: bare_long_digits
      regex: '(?<![\d.,$])\b\d{8,}\b(?![\d.,])'
      replacement: "[ID]"

  # 금액은 마스킹을 통과해야 한다. package_01 의 P&L 페이지로 검증했다.
  never_mask_regex:
    - '\$\s?[\d,]+\.?\d*'
    - '\b\d{1,3}(?:,\d{3})+(?:\.\d{2})?\b'

  # 개인 이름은 정규식만으로 신뢰성 있게 제거할 수 없다. 탐지된 이름은
  # 치환하며, 남는 위험은 README 에 명시했다.
  name_masking:
    enabled: true
    strategy: "signature_line_heuristic"
    replacement: "[NAME]"
    note: >
      Replaces capitalized two-to-three token sequences that appear adjacent to
      signature, borrower or applicant labels. Incomplete by construction.

  max_excerpt_chars: 1200

# -----------------------------------------------------------------------------
# 문서 유형 시그널
#
# `strong` 은 시그널 하나로 확정한다. 아래의 모든 문자열은 package_01 39페이지
# 전체를 대상으로 클래스 간 충돌을 검사했으며, 충돌 0건 / 잘못된 단일 시그널
# 확정 0건이었다.
#
# `weak` 는 점수에는 기여하지만 단독으로 확정하지 않는다. 여러 문서 유형에
# 걸쳐 나타나거나 일반적인 영어 표현인 문자열은 여기에 둔다.
# -----------------------------------------------------------------------------
doc_types:

  URLA_1003:
    strong:
      - "Uniform Residential Loan Application"
      - "Freddie Mac Form 65"
      - "Fannie Mae Form 1003"
    weak:
      - "Section 1a. Personal Information"
      - "Borrower Name"
      - "Unmarried Addendum"
      - "Continuation Sheet"
      - "Lender Loan Information"
      - "Demographic Information"
    marker_affinity: [N_OF_M]

  INCOME_DOC:
    strong:
      - "Profit & Loss Statement"
      - "W-2 Wage and Tax Statement"
      - "Verification of Employment"
      - "Earnings Statement"
      - "Form 1040"
      # 위 앵커는 package_01 의 P&L 명세서와 급여·W-2 계열 서식에서 추출한
      # 것이다. IRS Wage and Income Transcript 와 ICE Income Summary 계열에는
      # 대응하는 문구가 없어, package_02 에서는 2페이지 문서의 첫 페이지만
      # strong 매칭되고 연속 페이지와 표지 페이지는 0점이었다.
      # 아래 7개 문자열이 package_01 텍스트에 존재하지 않음을 먼저 검증한 뒤
      # 추가했다.
      - "Wage and Income Transcript"
      - "Income Summary"
      - "This Product Contains Sensitive Taxpayer Data"
    weak:
      - "CTEC"
      - "Total Expenses"
      - "Net Income"
      - "Gross Pay"
      - "Pay Period"
      - "1099"
      # 위 strong 블록과 동일한 IRS 트랜스크립트 계열 갭에 대한 보조 신호.
      - "Medicare Wages"
      - "Social Security Wages"
      - "Wages, Tips and Other Compensation"
      - "Employer Identification Number"
    marker_affinity: [NONE]
    # 알려진 갭: package_01 의 P&L 페이지는 제목이 이미지로 렌더링되어 strong
    # 시그널이 걸리지 않고 LLM 으로 위임된다. 하이브리드 설계의 핵심 근거다.

  CREDIT_REPORT:
    strong:
      - "TUC/EXP/EQX"
      - "XACTUS"
      - "Credit Score Disclosure"
      - "Your Credit Score and the Price You Pay"
    weak:
      - "Order Verifications"
      - "Underwriting Alerts"
      - "Notice to the Home Loan Applicant"
      - "Credit Repositories"
      - "Tradeline"
      - "Manner of Payment"
      - "Trended Data"
    marker_affinity: [PAGE_N_OF_M]
    # 벤더 로고가 래스터 이미지라서 18페이지 중 9페이지에는 브랜드명이 텍스트
    # 레이어에 없다. 저장소 코드 "TUC/EXP/EQX" 가 그 페이지들을 커버한다.
    # 벤더 주소도 커버할 수 있지만 이 데이터셋에 대한 과적합이라 제외했다.

  TITLE_REPORT:
    strong:
      - "CLTA Preliminary Report Form"
      - "Preliminary Title Report"
      - "Fidelity National Title"
      - "Title Commitment"
      - "PRELIM NO."
      - "Prelim Number"
      # 위 앵커는 CLTA 계열(캘리포니아, Fidelity National Title) 전용이다.
      # package_02 의 ALTA 계열(버지니아, First American Title) 커미트먼트에서는
      # 어느 페이지에서도 strong 시그널이 걸리지 않아 문서 전체가 미분류로
      # 떨어졌다.
      # 아래 9개 문자열이 package_01 텍스트에 존재하지 않음을 먼저 검증한 뒤
      # 추가했다.
      - "Commitment for Title Insurance"
      - "American Land Title Association"
      - "First American Title"
      - "Commitment Conditions"
      - "Chain of Title"
    weak:
      - "EXHIBIT A"
      - "Legal Description"
      - "Trustor/Grantor"
      - "Deed of Trust"
      - "END OF EXCEPTIONS"
      - "INFORMATIONAL NOTES"
      # 위 strong 블록과 동일한 ALTA 계열 갭에 대한 보조 신호.
      - "Proposed Insured"
      - "Deed Book"
      - "Issuing Agent"
      - "Assessed Value"
    marker_affinity: [CLTA_PAGE_N]

  OTHER:
    strong: []
    weak: []
    marker_affinity: []
    # 의도적으로 양성 시그널을 두지 않는다. 룰 단계에서는 어떤 문서 유형의
    # 시그니처도 매칭되지 않을 때 OTHER 를 top-1 후보로 반환한다. weak
    # 시그니처만 매칭된 경우에는 해당 유형을 후보로 유지하되 낮은 rule_score 로
    # LLM 위임 대상에 포함할 수 있다. LLM 단계가 구현될 경우 모델이 판정
    # 불가로 OTHER 를 반환할 수도 있으나, 제출본에서는 실제 LLM 호출이 없다.
    # package_01 에는 OTHER 페이지가 0개이므로 이 경로(정밀도/재현율/F1)는
    # 충분히 검증되지 않았다.

# -----------------------------------------------------------------------------
# 모호한 문자열 목록. 이후 편집으로 `strong` 에 승격되는 일이 없도록 명시한다.
# 각 항목은 둘 이상의 문서 유형에 나타나거나, 오탐을 일으킬 만큼 일반적이다.
# -----------------------------------------------------------------------------
never_strong:
  - "Schedule A"
  - "Schedule B"
  - "ALTA"
  - "1099"
  - "CTEC"
  - "Inquiries"
  - "Credit Account"
  - "FICO"
  - "Vesting"
  - "MK LENDING CORP."
  - "Order Verifications"
  - "Loan Number"
  - "Borrower"

# -----------------------------------------------------------------------------
# 논리적 문서 재조립, MVP 범위.
#
# 단계는 3개뿐이다. 더 깊은 근거 단계도 검토했으나 채택하지 않았다. 추가
# 단계는 package_01 로 검증할 수 없어 테스트되지 않은 코드로 배포된다.
# -----------------------------------------------------------------------------
reconstruction:
  enabled: true
  tiers:
    - name: strong_identifier_and_marker
      requires: [doc_type, instance_id, marker_style, marker_page]
      evidence_label: "identifier_and_marker_match"
    - name: form_family_and_marker
      requires: [doc_type, marker_style, marker_page]
      evidence_label: "marker_match_within_unique_instance"
      emit_warning: true
    - name: insufficient
      action: orphan
      evidence_label: "insufficient_evidence"

  duplicate_policy: "keep_both_and_flag"
  conflicting_marker_total_policy: "split_into_separate_documents"
